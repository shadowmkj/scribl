[package]
name = "scribl"
version = "0.1.1"
description = "Minimal, modal, keyboard-centric canvas for infinite thinking"
authors = ["Milan Pramod"]
license = "MIT"
repository = "https://github.com/shadowmkj/scribl"
homepage = "https://github.com/shadowmkj/scribl"
readme = "../README.md"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scribl_lib"

[dependencies]
dirs = "6.0"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
notify = "6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 1
